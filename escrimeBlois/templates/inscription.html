{% extends "base.html" %} {% block main %}
<div class="block-inscription">
  <img
    src="../static/images/logo_cercle_escrime_blois.png"
    id="logo-fiche"
    required
  />
  <form class="form-inscription" method="POST" name="form-inscrip">
    <h1>Inscription au cercle</h1>
    <div class="two-tf">
      <label for="nom"> 1. Nom complet <span id="obligatoire">*</span> </label>
      <div>
        <input class="nom" type="text" placeholder="Nom" required />
        <input class="prenom" type="text" placeholder="Prenom" required />
      </div>
    </div>
    <div class="mot-de-passe base-block two-tf">
      <label for="mot-de-passe">
        2. Mot de passe <span id="obligatoire">*</span>
      </label>
      <div>
        <input
          class="mdp"
          type="password"
          placeholder="Le mot de passe"
          required
        />
        <input
          class="mdp"
          type="password"
          placeholder="Confirmer le mot de passe"
          required
        />
      </div>
    </div>
    <div class="sexe">
      <label for="sexe"> 3. Sexe <span id="obligatoire">*</span> </label>
      <div>
        <input type="radio" name="choix_sexe" value="Homme" required />
        <label for="homme">Homme</label><br />
        <input type="radio" name="choix_sexe" value="Femme" required />
        <label for="femme">Femme</label><br />
      </div>
    </div>
    <div class="ddn">
      <label for="date-naissance"
        >4. Date de naissance <span id="obligatoire">*</span></label
      >
      <div>
        <input type="date" name="date-naissance" id="date-naissance" required />
      </div>
    </div>
    <div class="num base-block">
      <label for="num">
        5. Numéro de téléphone <span id="obligatoire">*</span>
      </label>
      <div>
        <input
          class="textfield"
          type="text"
          required
          pattern="[0-9]"
          inputmode="numeric"
          oninput="this.value = this.value.replace(/[^0-9]/g, '');"
        />
      </div>
    </div>
    <div class="mail base-block">
      <label for="mail">
        6. Adresse email <span id="obligatoire">*</span></label
      >
      <div>
        <input class="textfield" type="text" required />
      </div>
    </div>
    <div class="adresse-postale base-block">
      <label for="adresse-postale">
        7. Adresse postale <span id="obligatoire">*</span>
      </label>
      <div>
        <input class="textfield" type="text" required />
      </div>
    </div>
    <div id="form-dyna"></div>
    <div class="CACA">
      <input type="submit" value="Déposer l'inscription" />
    </div>
  </form>
</div>
{% endblock %}{% block scripts %}
<script src="{{ url_for('static', filename='js/date_dynamique.js') }}"></script>
<script src="{{ url_for('static', filename='js/justificatif.js') }}"></script>
{% endblock %}
