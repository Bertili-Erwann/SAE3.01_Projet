articles:
  - id_article: 1
    titre: "Nouvelles du club"
    date_publication: "2025-10-20"
    description: "Nous sommes ravis d'accueillir tous nos membres, anciens et nouveaux, pour cette nouvelle saison d'escrime à Blois qui s'annonce riche en émotions et en événements sportifs."
    categorie: "Actualités"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: 1
  - id_article: 2
    titre: "Succès au Championnat Régional"
    date_publication: "2025-10-25"
    description: "Nos escrimeurs ont brillé lors du championnat régional d'épée ce week-end. Marie Martin remporte la médaille d'or et Pierre Lemoine décroche une belle 3ème place. Félicitations à tous les participants pour leur combativité !"
    categorie: "Résultats"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: 2
  - id_article: 3
    titre: "Stage d'Initiation pour Débutants"
    date_publication: "2025-11-01"
    description: "Le club organise un stage d'initiation au fleuret pour les débutants le 15 novembre. C'est l'occasion idéale pour découvrir l'escrime dans une ambiance conviviale. Inscription obligatoire avant le 10 novembre."
    categorie: "Événements"
    lien: null
    commentable: true
    responsable_id: 5
    miniature: 3
  - id_article: 4
    titre: "Nouveaux Horaires d'Entraînement"
    date_publication: "2025-11-03"
    description: "À partir du mois de décembre, les horaires d'entraînement du mercredi évoluent pour mieux s'adapter aux emplois du temps de chacun. Consultez le planning mis à jour dans la rubrique Horaires."
    categorie: "Actualités"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: null
  - id_article: 5
    titre: "Interview avec Thomas Lefebvre"
    date_publication: "2025-11-08"
    description: "Découvrez le parcours de Thomas Lefebvre, notre maître d'armes spécialisé en sabre, qui nous parle de sa passion pour l'escrime et de ses objectifs pour le club cette saison. Une interview inspirante à ne pas manquer !"
    categorie: "Portraits"
    lien: null
    commentable: true
    responsable_id: 5
    miniature: null
  - id_article: 6
    titre: "Gala de Fin d'Année 2025"
    date_publication: "2025-11-12"
    description: "Réservez votre soirée du 15 décembre pour notre traditionnel gala de fin d'année ! Au programme : démonstrations d'escrime, remise de prix, et buffet convivial. Entrée gratuite pour les membres et leurs familles."
    categorie: "Événements"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: 4
  - id_article: 7
    titre: "Résultats du Tournoi Club"
    date_publication: "2025-11-06"
    description: "Le tournoi interne de fleuret qui s'est déroulé le 5 novembre a été un grand succès. Bravo à Pierre Lemoine pour sa victoire et merci à tous les participants. Rendez-vous le mois prochain pour le tournoi d'épée !"
    categorie: "Résultats"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: 2
  - id_article: 8
    titre: "L'Escrime : Un Sport pour Tous"
    date_publication: "2025-11-15"
    description: "L'escrime est un sport accessible à tous, des plus jeunes aux seniors. Discipline, agilité, réflexes et fair-play sont les maîtres-mots de notre pratique. Rejoignez-nous pour découvrir tous les bienfaits de ce sport olympique !"
    categorie: "Actualités"
    lien: "https://www.ffescrime.fr/"
    commentable: true
    responsable_id: 5
    miniature: 3
  - id_article: 9
    titre: "Matériel : Bien Choisir son Équipement"
    date_publication: "2025-11-18"
    description: "Un guide complet pour vous aider à choisir votre équipement d'escrime : masque, gants, chaussures, armes... Nos conseils pour trouver le matériel adapté à votre niveau et à votre pratique. Location possible au club pour les débutants."
    categorie: "Conseils"
    lien: null
    commentable: true
    responsable_id: 5
    miniature: 7
  - id_article: 10
    titre: "Retour sur le Championnat National"
    date_publication: "2025-11-22"
    description: "Thomas Lefebvre et Hugo Girard ont représenté fièrement notre club au championnat national de sabre à Paris. Malgré une forte concurrence, nos deux escrimeurs ont réalisé de belles performances. Thomas termine 8ème au classement général !"
    categorie: "Résultats"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: 2
  - id_article: 11
    titre: "L'Histoire de l'Escrime à Blois"
    date_publication: "2025-11-25"
    description: "Plongez dans l'histoire du Cercle d'Escrime de Blois, de ses origines en 1883 à aujourd'hui. Une tradition centenaire qui continue de former des champions et de promouvoir les valeurs de l'escrime dans notre région."
    categorie: "Histoire"
    lien: null
    commentable: true
    responsable_id: 5
    miniature: 5
  - id_article: 12
    titre: "Préparation aux JO 2028"
    date_publication: "2025-11-28"
    description: "Plusieurs de nos jeunes talents suivent un programme de préparation olympique. Découvrez les parcours de ces escrimeurs prometteurs qui rêvent de représenter la France aux Jeux Olympiques de Los Angeles en 2028."
    categorie: "Actualités"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: 5
  - id_article: 13
    titre: "Stages Vacances de Noël"
    date_publication: "2025-12-01"
    description: "Profitez des vacances de Noël pour progresser en escrime ! Nous organisons des stages intensifs du 26 au 29 décembre pour tous les niveaux. Inscriptions ouvertes dès maintenant, places limitées."
    categorie: "Événements"
    lien: null
    commentable: true
    responsable_id: 5
    miniature: 4
  - id_article: 14
    titre: "Les Bienfaits de l'Escrime chez les Jeunes"
    date_publication: "2025-12-03"
    description: "L'escrime développe la concentration, la coordination et la confiance en soi chez les enfants et adolescents. Un article détaillé sur les apports pédagogiques et psychologiques de notre discipline pour les jeunes pratiquants."
    categorie: "Conseils"
    lien: null
    commentable: true
    responsable_id: 5
    miniature: 7
  - id_article: 15
    titre: "Résultats Tournoi Mixte"
    date_publication: "2025-12-09"
    description: "Le tournoi mixte épée-fleuret du 8 décembre a rassemblé plus de 30 participants ! Sophie Bernard s'impose en fleuret et Antoine Rousseau remporte l'épée. Une journée festive qui a ravi tous les escrimeurs."
    categorie: "Résultats"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: 2
  - id_article: 16
    titre: "Portrait : Marie Martin, Notre Championne"
    date_publication: "2025-12-12"
    description: "À 40 ans, Marie Martin collectionne les médailles en compétition régionale. Rencontre avec cette épéiste passionnée qui jongle entre son rôle de responsable du club et sa carrière de compétitrice de haut niveau."
    categorie: "Portraits"
    lien: null
    commentable: true
    responsable_id: 5
    miniature: 1
  - id_article: 17
    titre: "La Technique du Fleuret Expliquée"
    date_publication: "2025-12-15"
    description: "Un article technique pour comprendre les fondamentaux du fleuret : la garde, les attaques, les parades et les contre-attaques. Idéal pour les débutants qui souhaitent progresser rapidement."
    categorie: "Conseils"
    lien: null
    commentable: true
    responsable_id: 5
    miniature: 3
  - id_article: 18
    titre: "Saison 2026 : Nouveaux Projets"
    date_publication: "2025-12-18"
    description: "Le comité directeur dévoile les projets pour 2026 : acquisition de nouveau matériel, création d'une section handisport, et participation à davantage de compétitions nationales. Une année ambitieuse qui s'annonce !"
    categorie: "Actualités"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: 4
  - id_article: 19
    titre: "L'Épée : Arme de Précision"
    date_publication: "2025-12-22"
    description: "Découvrez les spécificités de l'épée, arme d'escrime qui demande stratégie et précision. Contrairement au fleuret et au sabre, tout le corps est surface valable. Un guide complet pour les passionnés."
    categorie: "Conseils"
    lien: null
    commentable: true
    responsable_id: 5
    miniature: 3
  - id_article: 20
    titre: "Bilan du Gala 2025"
    date_publication: "2025-12-17"
    description: "Le gala de fin d'année a rassemblé plus de 150 personnes ! Les démonstrations des jeunes escrimeurs ont émerveillé le public. Merci à tous les bénévoles et participants qui ont fait de cette soirée un moment inoubliable."
    categorie: "Événements"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: 6
  - id_article: 21
    titre: "Escrime et Santé : Les Bienfaits"
    date_publication: "2026-01-05"
    description: "Pratique régulière de l'escrime : amélioration cardiovasculaire, renforcement musculaire, développement de la coordination et des réflexes. Découvrez tous les bénéfices de notre sport pour votre santé physique et mentale."
    categorie: "Conseils"
    lien: null
    commentable: true
    responsable_id: 5
    miniature: 8
  - id_article: 22
    titre: "Inscriptions Semestre Printemps 2026"
    date_publication: "2026-01-10"
    description: "Les inscriptions pour le semestre de printemps sont ouvertes ! Que vous soyez débutant ou confirmé, rejoignez-nous pour vivre votre passion de l'escrime. Session d'inscription le 15 février au bureau du club."
    categorie: "Actualités"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: 1
  - id_article: 23
    titre: "Compétition Régionale Féminine à Venir"
    date_publication: "2026-01-08"
    description: "Nos escrimeuses se préparent activement pour la compétition régionale féminine du 12 janvier à Tours. Marie Martin, Léa Bonnet et Sophie Bernard représenteront le club. Venez les encourager !"
    categorie: "Événements"
    lien: null
    commentable: true
    responsable_id: 2
    miniature: 4
  - id_article: 24
    titre: "Le Sabre : Vitesse et Explosivité"
    date_publication: "2026-01-15"
    description: "Le sabre est l'arme la plus dynamique de l'escrime, privilégiant la vitesse et l'explosivité. Découvrez les règles spécifiques, les techniques de taille et d'estoc, et pourquoi cette discipline fascine autant de pratiquants."
    categorie: "Conseils"
    lien: null
    commentable: true
    responsable_id: 5
    miniature: 3
  - id_article: 25
    titre: "Partenariat avec la Fédération Française"
    date_publication: "2026-01-20"
    description: "Le Cercle d'Escrime de Blois renforce son partenariat avec la Fédération Française d'Escrime. Ce rapprochement permettra à nos membres d'accéder à davantage de formations et de ressources pour progresser."
    categorie: "Actualités"
    lien: "https://www.ffescrime.fr/"
    commentable: true
    responsable_id: 2
    miniature: 5

