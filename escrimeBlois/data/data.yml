informations:
  - id: 1
    titre: "Comité directeur du Cercle"
    ordre: 1
    contenu: |
      <p class="indentP">
        Le comité directeur du Cercle d’Escrime de Blois est constitué comme suit
        :
      </p>
      <ul>
        <li class="indentL"><strong>Président</strong> : Régis ECHE</li>
        <li class="indentL">
          <strong>Vice-président</strong> : Dominique MARQUET
        </li>
        <li class="indentL">
          <strong>Trésorier Général</strong> : Bernard DELADERIERE
        </li>
        <li class="indentL">
          <strong>Secrétaire Générale</strong> : Pascale LHOMME
        </li>
        <li class="indentL">
          <strong>Membres</strong> : Pascal BIZIEUX; Jon NOTTINGHAM; Christophe
          LECHOPIER
        </li>
      </ul>
      <br />
  - id: 2
    titre: "Horaires"
    ordre: 2
    contenu: |
      <table class="table100-body">
        <br />
        <thead>
          <tr class="table100">
            <th scope="col" class="tab">Jour</th>
            <th scope="col" class="tab">Horaires</th>
            <th scope="col" class="tab">Activité</th>
            <th scope="col" class="tab">Public concerné</th>
          </tr>
        </thead>
        <tbody>
          <tr class="body">
            <th class="tab">Mardi</th>
            <td class="tab">19h00 – 21h15</td>
            <td class="tab">Entraînement Épée</td>
            <td class="tab">M17, M20, Seniors, Vétérans</td>
          </tr>
          <tr class="body">
            <th scope="row" rowspan="3" class="tab">Mercredi</th>
            <td class="tab">17h00 – 18h00</td>
            <td class="tab">Initiation Fleuret</td>
            <td class="tab">Débutants (filles & garçons, 8 à 12 ans)</td>
          </tr>
          <tr class="body">
            <td class="tab">18h15 – 19h45</td>
            <td class="tab">Entraînement Fleuret ou Épée</td>
            <td class="tab">M11 à M20</td>
          </tr>
          <tr class="body">
            <td class="tab">19h45 – 21h15</td>
            <td class="tab">Escrime Loisir (Épée)</td>
            <td class="tab">Débutants ados & adultes (H & F)</td>
          </tr>
          <tr class="body">
            <th scope="row" class="tab">Vendredi</th>
            <td class="tab">19h00 – 21h15</td>
            <td class="tab">Entraînement Épée (libre)</td>
            <td class="tab">M17 à Vétérans</td>
          </tr>
        </tbody>
      </table>
      <br />
  - id: 3
    titre: "Matériels et tenues"
    ordre: 3
    contenu: |
      <div class="deux-colonnes">
        <div class="colonne">
          <p class="indentP">
            Il est possible de louer à l’année sa tenue d’escrime :
          </p>
          <ul>
            <li class="indentL">Veste</li>
            <li class="indentL">Pantalon</li>
            <li class="indentL">Sous-cuirasse</li>
          </ul>
          <p class="indentP">Le gant n’est pas fourni.</p>
          <p class="indentP">Le montant de la location est de 45.00€</p>
        </div>

        <div class="colonne">
          <p class="indentP">
            Les licenciés sont ensuite tenus d’acheter leur propre matériel :
          </p>
          <ul>
            <li class="indentL">Masque</li>
            <li class="indentL">Gant (main armée)</li>
            <li class="indentL">Chaussettes montantes</li>
            <li class="indentL">Chaussures adaptées</li>
            <li class="indentL">
              Arme (fleuret, épée ou sabre selon la pratique)
            </li>
          </ul>
        </div>
      </div>
historique:
  - id_chronologique: 1
    date: "1883-1903"
    description: "Apparition de la pratique structurée de l'escrime à Blois au sein de la « Société de Gymnastique et d'Escrime La Blésoise »."
  - id_chronologique: 2
    date: "18 janvier 1911"
    description: "La « Société des Sports et d’Escrime de Loir-et-Cher » prend le relais sous la présidence du Dr Paterne."
  - id_chronologique: 3
    date: "18 janvier 1911"
    description: "Renaissance de l’escrime blésoise sous son identité actuelle : le « Cercle d'Escrime de Blois », présidé par M. René-Jean Congard."
  - id_chronologique: 4
    date: "1956"
    description: "Successeur : le Dr Muller."
  - id_chronologique: 5
    date: "1960"
    description: "Successeur : P. Cartier. Le maître Marcel Gerbaud officie dans la salle d'Armes, rue du Lion Ferré (jusqu'en 1964)."
  - id_chronologique: 6
    date: "1969"
    description: "Reprise des activités sous l’impulsion du président Philibert Martinot, assisté de Pierre Weber."
  - id_chronologique: 7
    date: "1971"
    description: "Le Cercle est hébergé dans les locaux du Palais des Sports de l’Abeille des Aides. Reprise sous la conduite du maître Claude Ruby."
  - id_chronologique: 8
    date: "1975"
    description: "Régis Eche succède à Claude Ruby en tant que maître."
  - id_chronologique: 9
    date: "1983"
    description: "Au retrait de Philibert Martinot, Pierre Havard reprend la présidence."
  - id_chronologique: 10
    date: "1990"
    description: "Installation du Cercle dans le gymnase de Cabochon."
  - id_chronologique: 11
    date: "1999"
    description: "Régis Eche prend la destinée du Cercle."
  - id_chronologique: 12
    date: "Novembre 2016"
    description: "Christophe Léchopier succède à Régis Eche."
  - id_chronologique: 13
    date: "Décembre 2018"
    description: "Décision d'une coprésidence avec Régis Eche et Christophe Léchopier."
  - id_chronologique: 14
    date: "10 décembre 2024"
    description: "Christophe Léchopier se retire ; Régis Eche est élu à la présidence du Cercle."
